[build-system]
requires = ["setuptools>=40.6.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-shadcn-ui"
version = "0.1.19"
readme = "README.md"
keywords = ["streamlit", "shadcn", "ui", "components"]
description = "Using shadcn components in Streamlit"
authors = [{ name = "Observed Observer", email = "ooer@kanaries.net" }]
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "streamlit >= 0.63",
    "streamlit_extras >= 0.3.5; python_version >= '3.8'",
]

[project.optional-dependencies]
components-v2 = ["streamlit >= 1.60"]

[project.license]
file = "LICENSE"

[project.urls]
homepage = "https://github.com/ObservedObserver/streamlit-shadcn-ui"
repository = "https://github.com/ObservedObserver/streamlit-shadcn-ui"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["streamlit_shadcn_ui*"]
namespaces = false

[tool.setuptools.package-data]
streamlit_shadcn_ui = [
    "pyproject.toml",
    "components/packages/frontend/dist/**/*",
    "frontend_v2/dist/**/*",
]
